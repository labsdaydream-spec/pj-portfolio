<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marisa Shoes — Night Shift Collection 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:auto}
    body{background:#05060C;overflow-x:hidden}
    button{border:none;background:none;cursor:pointer;padding:0;outline:none}
    @keyframes msdBounce{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(9px);opacity:.45}}
    @keyframes msdFlick{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.7}98%{opacity:1}}
    @keyframes msdCaret{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes msdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes msdOrbit{0%{transform:translate(0,0)}20%{transform:translate(9px,-7px)}40%{transform:translate(13px,5px)}60%{transform:translate(2px,12px)}80%{transform:translate(-9px,4px)}100%{transform:translate(0,0)}}
    @keyframes msdPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,0)}50%{box-shadow:0 0 22px 4px rgba(0,229,255,.25)}}
    @keyframes msdSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes msdSpinRev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}

    /* ── Responsive ── */
    .msd-page{width:100%;overflow-x:hidden}
    .msd-hero{height:clamp(480px,100vh,900px)!important}
    .msd-header{padding:0 clamp(14px,3.5vw,46px)!important;height:clamp(58px,7vw,84px)!important}
    .msd-hero-copy{left:clamp(16px,3.5vw,50px)!important;bottom:clamp(48px,6vw,84px)!important;max-width:min(1000px,94vw)!important}
    .msd-hero-h1{font-size:clamp(20px,3.8vw,44px)!important;white-space:normal!important}
    .msd-section-pad{padding:clamp(44px,6vw,96px) clamp(16px,4.5vw,70px) clamp(52px,7vw,104px)!important}
    .msd-about-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4.5vw,64px);align-items:center}
    .msd-about-h2{font-size:clamp(26px,3.8vw,50px)!important}
    .msd-about-p{font-size:clamp(15px,1.5vw,19px)!important}
    .msd-feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.2vw,16px)}
    .msd-interior{height:clamp(220px,38vw,600px)!important}
    .msd-catalog-pad{padding:clamp(44px,6vw,90px) clamp(16px,4.5vw,70px) clamp(52px,7vw,100px)!important}
    .msd-test-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(16px,2vw,30px);align-items:center}
    .msd-footer-pad{padding:clamp(32px,5vw,70px) clamp(16px,4.5vw,70px) clamp(22px,3vw,44px)!important}
    .msd-footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.2vw,18px)}
    .msd-footer-h2{font-size:clamp(32px,5vw,60px)!important}
    .msd-tour-label{font-size:clamp(36px,7vw,72px)!important}
    .msd-tour-caret{height:clamp(32px,5.5vw,64px)!important}
    .msd-nav{gap:clamp(12px,2vw,28px)!important}
    .msd-nav span{font-size:clamp(9px,1vw,11px)!important}
    .msd-header-links span{font-size:clamp(9px,1vw,11px)!important}
    @media(max-width:900px){
      .msd-about-grid{grid-template-columns:1fr!important}
      .msd-feat-grid{grid-template-columns:repeat(3,1fr)}
      .msd-test-grid{grid-template-columns:1fr!important}
      .msd-footer-grid{grid-template-columns:1fr!important}
    }
    @media(max-width:620px){
      .msd-feat-grid{grid-template-columns:1fr!important}
      .msd-hero-nav{display:none!important}
      .msd-hero-links{display:none!important}
      .msd-catalog-filter-bar{flex-wrap:wrap!important;gap:8px!important}
    }
  </style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
var T={pink:'#FF3CAC',cobalt:'#2979FF',cyan:'#00E5FF',ink:'#1C1916',void:'#05060C'};
var FB="'Poppins',sans-serif";
var IMG='./img/';
var TOUR_N=234,FOOTER_N=304;
function pad4(n){return String(n).padStart(4,'0');}
function preloadFrames(n,folder){
  return Array.from({length:n},function(_,i){
    var img=new Image();
    img.src='./frames/'+folder+'/frame_'+pad4(i+1)+'.jpg';
    return img;
  });
}
var tourImgs=preloadFrames(TOUR_N,'tour');
var footerImgs=preloadFrames(FOOTER_N,'footer');
</script>

<script type="text/babel">

function NeonWord(props){
  var size=props.size||20;
  var PP="'Poppins',sans-serif";
  return(
    <span style={{display:'inline-flex',flexDirection:'column',alignItems:'center',lineHeight:1,gap:2}}>
      <span style={{fontFamily:PP,fontSize:size,fontWeight:700,letterSpacing:size*0.16,textTransform:'uppercase',color:T.pink,
        WebkitTextStroke:(size*0.055).toFixed(1)+'px '+T.cobalt,paintOrder:'stroke fill',
        textShadow:'0 0 '+(size*.7)+'px rgba(255,60,172,.7),0 0 '+(size*1.4)+'px rgba(41,121,255,.4)'}}>MARISA</span>
    </span>
  );
}

function CanvasScrubber(props){
  var frames=props.frames,wrapperHeight=props.wrapperHeight||'300vh',sectionHeight=props.sectionHeight||'100vh',gradient=props.gradient,children=props.children;
  var wrapRef=React.useRef(null),innerRef=React.useRef(null),c1Ref=React.useRef(null),c2Ref=React.useRef(null),aliveRef=React.useRef(true);
  React.useEffect(function(){
    var c1=c1Ref.current,c2=c2Ref.current,inner=innerRef.current;
    if(!c1||!c2||!inner)return;
    var ctx1=c1.getContext('2d',{alpha:false}),ctx2=c2.getContext('2d');
    aliveRef.current=true;
    var cf=0,tf=0;
    function getProgress(){
      var wrap=wrapRef.current;if(!wrap)return 0;
      var rect=wrap.getBoundingClientRect(),total=wrap.offsetHeight-window.innerHeight;
      if(total<=0)return 0;
      return Math.max(0,Math.min(1,-rect.top/total));
    }
    function raf(){
      if(!aliveRef.current)return;
      var wrap=wrapRef.current;
      if(wrap&&inner){
        var rect=wrap.getBoundingClientRect(),wH=window.innerHeight;
        if(rect.top<=0&&rect.bottom>=wH){
          inner.style.position='fixed';inner.style.top='0';inner.style.bottom='auto';
          inner.style.left=rect.left+'px';inner.style.width=wrap.offsetWidth+'px';
        } else if(rect.bottom>0&&rect.bottom<wH){
          inner.style.position='absolute';inner.style.top='auto';inner.style.bottom='0';
          inner.style.left='0';inner.style.width='100%';
        } else {
          inner.style.position='absolute';inner.style.top='0';inner.style.bottom='auto';
          inner.style.left='0';inner.style.width='100%';
        }
      }
      var p=getProgress();
      tf=p*(frames.length-1);cf+=(tf-cf)*0.18;
      var fA=Math.max(0,Math.min(frames.length-1,Math.floor(cf))),fB=Math.min(frames.length-1,fA+1);
      var mix=cf-Math.floor(cf);
      if(frames[fA]&&frames[fA].complete&&frames[fA].naturalWidth){ctx1.drawImage(frames[fA],0,0,c1.width,c1.height);}
      ctx2.clearRect(0,0,c2.width,c2.height);
      if(frames[fB]&&frames[fB].complete&&frames[fB].naturalWidth&&mix>0.01){ctx2.globalAlpha=mix;ctx2.drawImage(frames[fB],0,0,c2.width,c2.height);ctx2.globalAlpha=1;}
      var sc=(1+p*0.09).toFixed(4);
      c1.style.transform='scale('+sc+')';c2.style.transform='scale('+sc+')';
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    return function(){aliveRef.current=false;};
  },[frames]);
  return(
    <div ref={wrapRef} style={{position:'relative',height:wrapperHeight}}>
      <div ref={innerRef} style={{position:'absolute',top:0,left:0,width:'100%',height:sectionHeight,overflow:'hidden',background:T.void}}>
        <canvas ref={c1Ref} width={1280} height={720} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',transformOrigin:'center center'}}/>
        <canvas ref={c2Ref} width={1280} height={720} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',transformOrigin:'center center'}}/>
        {gradient&&<div style={{position:'absolute',inset:0,background:gradient,pointerEvents:'none'}}/>}
        {children}
      </div>
    </div>
  );
}

function TypeTour(){
  var full='take a tour';
  var ns=React.useState(0);var n=ns[0];var setN=ns[1];
  var ds=React.useState(1);var dir=ds[0];var setDir=ds[1];
  React.useEffect(function(){
    var t;
    if(dir===1&&n<full.length)t=setTimeout(function(){setN(n+1);},145);
    else if(dir===1&&n===full.length)t=setTimeout(function(){setDir(-1);},1800);
    else if(dir===-1&&n>0)t=setTimeout(function(){setN(n-1);},65);
    else t=setTimeout(function(){setDir(1);},550);
    return function(){clearTimeout(t);};
  },[n,dir]);
  return(
    <div style={{display:'inline-flex',alignItems:'baseline'}}>
      <span className="msd-tour-label" style={{fontFamily:"'Poppins',sans-serif",fontWeight:600,fontSize:72,letterSpacing:1,textTransform:'lowercase',whiteSpace:'pre',
        color:'#FF3CAC',WebkitTextStroke:'1.3px #2979FF',paintOrder:'stroke fill',
        textShadow:'0 0 16px rgba(255,60,172,.6),0 0 32px rgba(41,121,255,.5),0 0 64px rgba(0,229,255,.3)'}}>
        {full.slice(0,n)}
      </span>
      <span className="msd-tour-caret" style={{display:'inline-block',width:5,height:64,marginLeft:6,background:'#00E5FF',
        boxShadow:'0 0 14px #00E5FF,0 0 26px #00E5FF88',animation:'msdCaret 0.85s step-end infinite'}}/>
    </div>
  );
}

function Testimonials(){
  var PP="'Poppins',sans-serif";
  var PEOPLE=[
    {id:0,name:'Amina Mwakalinga',img:'prof1',role:'Architect · Masaki',col:T.pink,bought:'For herself — the SERPENTINE',quote:"I came in for one pair and left feeling like the main character. The fitting was a private show — champagne, my stylist, and the SERPENTINE under the lights. Nothing in Dar comes close."},
    {id:1,name:'Emmanuel Shirima',img:'prof5',role:'Surgeon · Oyster Bay',col:T.cobalt,bought:'For his wife — the AMORE boots',quote:"I wanted our anniversary to mean something. The team helped me choose the AMORE boots in her size without her knowing. When she opened the box she actually cried. That is service."},
    {id:2,name:'Zawadi Mushi',img:'prof6',role:'Creative director · Upanga',col:T.cyan,bought:'For herself — the EMERALD',quote:"I design for a living, so I notice everything — the marble, the neon, how the shoe sits on the plinth. This is the first boutique in Tanzania that actually feels electric."},
    {id:3,name:'Baraka Mollel',img:'prof2',role:'Entrepreneur · Mikocheni',col:T.pink,bought:"For his fiancée — the CASCADE",quote:"Proposing meant doing it right. The CASCADE sandals were waiting on the plinth when she said yes. Marisa turned a moment into a memory she still talks about."},
    {id:4,name:'Neema Kessy',img:'prof7',role:'Event curator · Oyster Bay',col:T.cobalt,bought:'For herself + her brides',quote:"Marisa is where I send every bride who wants drama. The AMORE boots photographed like jewellery on my last client. They treat every appointment like couture."},
    {id:5,name:'Joseph Massawe',img:'prof3',role:'Banker · Kawe',col:T.cyan,bought:'For his wife — the CLEOPATRA',quote:"My wife collects statement shoes, so impressing her is hard. The CLEOPATRA cage boots did it instantly. The stylist understood her taste better than I did."},
    {id:6,name:'Halima Juma',img:'prof8',role:'Lawyer · Mikocheni',col:T.pink,bought:'For herself — the SCARLET',quote:"My SCARLET pumps have walked me into three boardrooms and a gala. They are loud in the best way — and worth every shilling."},
    {id:7,name:'Daniel Mtui',img:'prof4',role:'Cardiologist · Kawe',col:T.cobalt,bought:'For his wife — the CLEOPATRA',quote:"My wife had been eyeing the CLEOPATRA cage boots for weeks. I came in alone, the stylist remembered her size, and the look on her face that evening was worth every shilling."},
  ];
  var ORBIT=[{r:206,s:96},{r:114,s:76},{r:206,s:86},{r:114,s:78},{r:206,s:90},{r:114,s:80},{r:206,s:72},{r:114,s:70}];
  var as=React.useState(0);var active=as[0];var setActive=as[1];
  var p=PEOPLE[active];
  var qs=React.useState(p.quote);var shownQuote=qs[0];var setShownQuote=qs[1];
  var qvs=React.useState(true);var quoteVisible=qvs[0];var setQuoteVisible=qvs[1];
  var firstQuote=React.useRef(true);
  React.useEffect(function(){
    if(firstQuote.current){firstQuote.current=false;return;}
    setQuoteVisible(false);
    var qt=setTimeout(function(){setShownQuote(p.quote);setQuoteVisible(true);},150);
    return function(){clearTimeout(qt);};
  },[active]);
  return(
    <div className="msd-test-grid" style={{position:'relative',minHeight:560,display:'grid',gridTemplateColumns:'1fr 1.15fr',gap:30,alignItems:'center'}}>
      <div style={{position:'relative',height:560}}>
        <div style={{position:'absolute',left:'50%',top:'50%',width:8,height:8,borderRadius:999,transform:'translate(-50%,-50%)',background:T.cyan,boxShadow:'0 0 14px '+T.cyan+',0 0 32px '+T.cyan+'99'}}/>
        <div style={{position:'absolute',inset:0,animation:'msdSpin 64s linear infinite'}}>
          {PEOPLE.map(function(person,i){
            var ang=i*(360/PEOPLE.length),o=ORBIT[i],on=active===person.id;
            return(
              <div key={person.id} style={{position:'absolute',left:'50%',top:'50%',width:0,height:0,transform:'rotate('+ang+'deg) translateX('+o.r+'px)'}}>
                <div style={{position:'absolute',left:0,top:0,animation:'msdSpinRev 64s linear infinite'}}>
                  <div style={{transform:'rotate('+(-ang)+'deg)'}}>
                    <button onClick={function(){setActive(person.id);}} title={person.name}
                      style={{position:'absolute',left:-o.s/2,top:-o.s/2,width:o.s,height:o.s,cursor:'pointer',borderRadius:999,overflow:'hidden',background:'#0A090C',
                        border:'2px solid '+(on?person.col:'rgba(255,255,255,.30)'),
                        boxShadow:on?'0 0 26px '+person.col+',0 0 52px '+person.col+'66':'0 6px 18px rgba(0,0,0,.5)',
                        transition:'border-color .25s,box-shadow .25s'}}
                      onMouseEnter={function(e){if(!on){e.currentTarget.style.borderColor=person.col;e.currentTarget.style.boxShadow='0 0 22px '+person.col+',0 0 44px '+person.col+'55';}}}
                      onMouseLeave={function(e){if(active!==person.id){e.currentTarget.style.borderColor='rgba(255,255,255,.30)';e.currentTarget.style.boxShadow='0 6px 18px rgba(0,0,0,.5)';}}}>
                      <img src={IMG+person.img+'.jpg'} alt={person.name} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:on?'none':'saturate(.9)'}}/>
                      {!on&&<span style={{position:'absolute',inset:0,background:'radial-gradient(circle,transparent 55%,'+person.col+'22 100%)'}}/>}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{position:'absolute',left:'50%',bottom:2,transform:'translateX(-50%)',fontFamily:PP,fontSize:10.5,fontWeight:300,letterSpacing:2,textTransform:'uppercase',color:'#8C887F'}}>Tap a profile to read their story</div>
      </div>
      <div key={p.id} style={{borderRadius:22,padding:'40px 44px 38px',background:'rgba(13,13,18,.5)',border:'1.6px solid '+p.col,backdropFilter:'blur(14px) saturate(140%)',WebkitBackdropFilter:'blur(14px) saturate(140%)',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.06),0 0 30px '+p.col+'3A',animation:'msdFlick 0.5s'}}>
        <div style={{display:'flex',alignItems:'center',gap:18,marginBottom:22}}>
          <span style={{width:64,height:64,flexShrink:0,borderRadius:999,overflow:'hidden',display:'inline-block',position:'relative',background:'#0A090C',border:'2px solid '+p.col,boxShadow:'0 0 20px '+p.col+'66'}}>
            <img src={IMG+p.img+'.jpg'} alt={p.name} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
          </span>
          <div>
            <div style={{fontFamily:PP,fontSize:20,fontWeight:600,letterSpacing:.3,color:'#F6F2EA'}}>{p.name}</div>
            <div style={{fontFamily:PP,fontSize:12.5,fontWeight:300,color:p.col,marginTop:3,textShadow:'0 0 8px '+p.col+'66'}}>{p.role}</div>
          </div>
          <div style={{marginLeft:'auto',display:'flex',gap:4}}>
            {[0,1,2,3,4].map(function(s){return <span key={s} style={{color:p.col,fontSize:16,textShadow:'0 0 8px '+p.col+'99'}}>★</span>;})}
          </div>
        </div>
        <p style={{margin:0,fontFamily:PP,fontWeight:300,fontSize:19,lineHeight:1.78,color:'#ECE7DD',textShadow:'0 1px 8px rgba(0,0,0,.4)',opacity:quoteVisible?1:0,transition:'opacity .15s ease'}}>"{shownQuote}"</p>
        <div style={{marginTop:24,display:'inline-flex',alignItems:'center',gap:9,fontFamily:PP,fontSize:11,fontWeight:500,letterSpacing:1.5,textTransform:'uppercase',color:'#080810',padding:'8px 16px',borderRadius:999,background:'linear-gradient(95deg,'+p.col+','+p.col+'CC)',boxShadow:'0 0 16px '+p.col+'55'}}>
          ✓ {p.bought}
        </div>
      </div>
    </div>
  );
}

function ProductModal(props){
  var sel=props.sel,onClose=props.onClose,sizes=props.sizes,soldOut=props.soldOut,WA=props.WA,PP=props.PP;
  var ss=React.useState(null);var size=ss[0];var setSize=ss[1];
  var vs=React.useState(0);var variety=vs[0];var setVariety=vs[1];
  var as=React.useState(false);var added=as[0];var setAdded=as[1];
  var available=sizes.length>0;
  var MATS=['Italian nappa leather','Silk satin & crystal','Patent calf leather','Crushed velvet','Suede & crystal mesh','Metallic kidskin'];
  var mat=MATS[(sel.name.length+sel.name.charCodeAt(0))%MATS.length];
  var heelMm=[85,95,105,110,120][sel.name.length%5];
  var FINISHES=[{tag:sel.tone,note:'as shown'},{tag:'Crystal',note:'iced pavé'},{tag:'Noir',note:'matte black'}];
  var specs=[['Material',mat],['Heel',(heelMm/10).toFixed(1)+' cm sculpted'],['Lining','Cushioned leather'],['Sole','Lacquered leather']];
  var waText=encodeURIComponent("Hello Marisa Shoes, I'd like to order the "+sel.name+" ("+sel.desc+", "+FINISHES[variety].tag+" finish) — TZS "+sel.price+(size?", size EU "+size:"")+".");
  var waHref="https://wa.me/"+WA+"?text="+waText;
  function addToCart(){if(!size)return;setAdded(true);setTimeout(function(){setAdded(false);},1900);}
  var top=Math.max(28,Math.min((sel.y||0)-40,(sel.secH||2400)-628));
  return(
    <div onClick={onClose} style={{position:'absolute',inset:0,zIndex:9999,background:'rgba(5,5,8,.72)',backdropFilter:'blur(7px)',animation:'msdFlick .35s'}}>
      <div onClick={function(e){e.stopPropagation();}} style={{position:'absolute',top:top,left:'50%',transform:'translateX(-50%)',width:940,maxWidth:'calc(100% - 80px)',display:'grid',gridTemplateColumns:'0.92fr 1.08fr',borderRadius:22,overflow:'hidden',background:'rgba(13,13,18,.92)',border:'1.6px solid '+sel.col,boxShadow:'0 0 44px '+sel.col+'55,0 30px 80px rgba(0,0,0,.6)'}}>
        <div style={{position:'relative',minHeight:560,background:'#0A090C'}}>
          <img src={IMG+sel.file+'.jpg'} alt={sel.name} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
          <span style={{position:'absolute',bottom:16,left:18,fontFamily:PP,fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:'uppercase',color:sel.col}}>{FINISHES[variety].tag}</span>
        </div>
        <div style={{padding:'34px 36px 30px',display:'flex',flexDirection:'column'}}>
          <div style={{fontFamily:PP,fontSize:10.5,fontWeight:500,letterSpacing:3,textTransform:'uppercase',color:sel.col,marginBottom:9}}>Marisa · Night Shift</div>
          <h3 style={{margin:0,fontFamily:PP,fontWeight:600,fontSize:28,letterSpacing:.5,color:'#F6F2EA'}}>{sel.name}</h3>
          <div style={{fontFamily:PP,fontSize:13.5,fontWeight:300,fontStyle:'italic',color:'#B8B3A8',marginTop:5}}>{sel.desc}</div>
          <div style={{display:'flex',alignItems:'baseline',gap:8,marginTop:14}}>
            <span style={{fontFamily:PP,fontSize:11,letterSpacing:1.5,color:'#7E7A72'}}>TZS</span>
            <span style={{fontFamily:PP,fontSize:25,fontWeight:600,color:'#F6F2EA'}}>{sel.price}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'9px 18px',marginTop:18,paddingTop:16,borderTop:'1px solid rgba(255,255,255,.10)'}}>
            {specs.map(function(kv){return(<div key={kv[0]}><div style={{fontFamily:PP,fontSize:9,fontWeight:600,letterSpacing:2,textTransform:'uppercase',color:sel.col}}>{kv[0]}</div><div style={{fontFamily:PP,fontSize:12.5,fontWeight:300,color:'#E7E2D8',marginTop:2}}>{kv[1]}</div></div>);})}
          </div>
          <div style={{marginTop:18}}>
            <div style={{fontFamily:PP,fontSize:10,fontWeight:600,letterSpacing:2,textTransform:'uppercase',color:'#CFCABF',marginBottom:9}}>Varieties</div>
            <div style={{display:'flex',gap:10}}>
              {FINISHES.map(function(f,vi){var on=variety===vi;return(
